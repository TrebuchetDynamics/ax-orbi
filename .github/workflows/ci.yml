name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: ${{ matrix.python-version == '3.x' }}
      - run: make test
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile bin/ax-orbi image/ax-orbi-agent
          sh -n image/systemctl-shim
          bash -n verify/container.sh

  container-inputs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for changed image inputs
        id: diff
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA=$(git hash-object -w -t tree /dev/null)
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- image/ versions.toml verify/)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  container:
    needs: container-inputs
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.container-inputs.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify
